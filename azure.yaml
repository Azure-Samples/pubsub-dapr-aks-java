name: pubsub-dapr-aks-java
hooks:
  postprovision:
    shell: sh
    continueOnError: false
    interactive: true
    run: ./infra/dapr-install.sh
services:
  public-api-service:
    project: ./src/public-api-service
    language: java
    host: aks
  account-service:
    project: ./src/account-service
    language: java
    host: aks
  fraud-service:
    project: ./src/fraud-service
    language: java
    host: aks
  notification-service:
    project: ./src/notification-service
    language: java
    host: aks
metadata:
  template: pubsub-dapr-aks-java@0.0.1-beta
